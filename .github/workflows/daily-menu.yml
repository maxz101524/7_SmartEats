name: Daily menu update

# Scrapes today's UIUC dining menus, enriches new dishes with Gemini nutrition
# estimates and sentence-transformer embeddings, and commits the refreshed
# static JSON in frontend/public/data. Vercel redeploys on the push.

on:
  schedule:
    - cron: "0 10 * * *" # ~4-5am Central: today's menu
    - cron: "0 17 * * *" # ~11am-noon Central: retry / pick up menu edits
  workflow_dispatch:
    inputs:
      date:
        description: "Menu date (YYYY-MM-DD). Defaults to today in Central time."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-menu
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: SmartEats_config.settings.etl
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      USE_LOCAL_MODEL: "true"
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-etl.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-etl.txt

      - name: Rebuild database from static export
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" > .env
          python manage.py migrate -v 0
          python manage.py import_static

      - name: Scrape menu and enrich nutrition
        run: |
          MENU_DATE="${{ github.event.inputs.date }}"
          if [ -z "$MENU_DATE" ]; then MENU_DATE="$(date +%F)"; fi
          if [ -z "$GEMINI_API_KEY" ]; then EXTRA="--skip-gemini"; fi
          python manage.py scrape_menu --date="$MENU_DATE" $EXTRA
          python manage.py build_embeddings

      - name: Export static data
        run: python manage.py export_static

      - name: Commit refreshed data
        working-directory: .
        run: |
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "smarteats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): menu update $(date +%F)"
          git push
